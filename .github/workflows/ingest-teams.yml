name: Ingest MLB Teams

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install psycopg2-binary requests --break-system-packages

      - name: Run ingestion script
        run: python3 ingest_teams.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}